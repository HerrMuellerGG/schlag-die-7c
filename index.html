<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Schlag die 7c</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1826;--panel:#13283b;--panel2:#1a3550;--ink:#f4f7ff;--muted:#9fb3c8;--g:#2f8cff;--k:#ff7a29;--acc:#54c7cc;--acc-d:#2a9ea4;--ok:#22c55e;--bad:#ef4444;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select,textarea{font:inherit}
#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:rgba(84,199,204,.06);border-bottom:2px solid rgba(84,199,204,.35);min-height:64px}
.logo{height:48px;width:48px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
.tt{font-weight:700;font-size:24px;line-height:1.05}
.st{color:var(--acc);font-size:15px;font-weight:500}
.grow{flex:1}
.ib{background:var(--panel);border-radius:12px;padding:9px 13px;font-size:17px;font-weight:500;white-space:nowrap}
.ib:active{background:var(--panel2)}
.ib.warn{background:#7f1d1d}
.stat{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#64748b}.dot.on{background:var(--ok)}.dot.wait{background:var(--gold)}
#screen{flex:1;min-height:0;position:relative}
/* Start */
.startw{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.biglogo{width:130px;height:130px;border-radius:24px;background:#fff;object-fit:contain;padding:8px}
.startw h1{margin:6px 0 0;font-size:46px}.startw .st{font-size:22px}
.startbtns{display:flex;gap:22px;margin:18px 0;flex-wrap:wrap;justify-content:center}
.sbtn{background:var(--panel);border:3px solid var(--acc);border-radius:26px;padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:64px;min-width:260px}
.sbtn b{font-size:28px}.sbtn span{font-size:17px;color:var(--muted)}
.sbtn:active{transform:scale(.97)}
/* Menü */
.menuwrap{height:100%;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.mt{display:flex;justify-content:center;align-items:center;gap:18px;font-size:24px;font-weight:600}
.mt .g{color:var(--g)}.mt .k{color:var(--k)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{background:var(--panel);border-radius:20px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:5px;border:2px solid rgba(84,199,204,.25)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:44px;line-height:1}.tile .nm{font-size:23px;font-weight:700}.tile .ds{color:var(--muted);font-size:15px;line-height:1.3}
.tile.tb{background:linear-gradient(135deg,#3a2a00,#6b4d00);border-color:var(--gold)}
.tile.tr{background:linear-gradient(135deg,#0f3d40,#1d6b6f);border-color:var(--acc)}
/* Spiele */
.game{height:100%;display:flex;flex-direction:column;position:relative}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.side{border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;min-height:0;position:relative;overflow:hidden}
.side.g{background:linear-gradient(180deg,#173a73,#10264d);border:3px solid var(--g)}
.side.k{background:linear-gradient(180deg,#6b2f10,#45200b);border:3px solid var(--k)}
.sh{font-weight:700;font-size:23px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.tag{font-size:14px;font-weight:500;background:rgba(0,0,0,.3);border-radius:999px;padding:3px 10px;color:#dbe4ff}
.locked{filter:grayscale(.7) brightness(.7)}
.fok{animation:fok .4s}.fbad{animation:fbad .4s}
@keyframes fok{0%{box-shadow:inset 0 0 0 2000px rgba(34,197,94,.5)}100%{box-shadow:inset 0 0 0 2000px rgba(34,197,94,0)}}
@keyframes fbad{0%{box-shadow:inset 0 0 0 2000px rgba(239,68,68,.55)}100%{box-shadow:inset 0 0 0 2000px rgba(239,68,68,0)}}
.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.center>*{pointer-events:auto}
.setup{background:rgba(11,24,38,.97);border:2px solid var(--acc);border-radius:26px;padding:22px 28px;max-width:min(720px,94vw);max-height:94%;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.setup h2{margin:0 0 8px;font-size:32px}.setup p{color:#d5e2ee;font-size:19px;line-height:1.4;margin:0 0 14px}
.bigbtn{background:var(--acc);color:#05292b;font-size:30px;font-weight:700;padding:15px 46px;border-radius:999px;box-shadow:0 6px 0 var(--acc-d)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--acc-d)}
.cd{font-size:min(30vh,220px);font-weight:700;color:var(--acc);text-shadow:0 8px 30px rgba(0,0,0,.6);pointer-events:none}
.msg{background:rgba(11,24,38,.96);border-radius:22px;padding:18px 28px;text-align:center;font-size:26px;font-weight:600;display:flex;flex-direction:column;gap:14px;align-items:center;border:2px solid var(--acc)}
.cover{position:absolute;inset:0;z-index:4;background:rgba(10,15,25,.93);display:grid;place-items:center;text-align:center;font-size:28px;font-weight:600;border-radius:17px;padding:20px}
/* Tauziehen */
.ropebar{height:92px;position:relative;margin:8px 16px 0;border-radius:18px;background:rgba(255,255,255,.05);overflow:hidden}
.winline{position:absolute;top:0;bottom:0;width:4px;background:repeating-linear-gradient(180deg,#fff 0 8px,transparent 8px 16px);opacity:.6}
.rope{position:absolute;inset:0;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.rope .line{position:absolute;left:-60%;right:-60%;top:50%;height:12px;margin-top:-6px;border-radius:6px;background:repeating-linear-gradient(60deg,#c99a5b 0 8px,#8d6331 8px 14px)}
.ropebar .fig{position:absolute;top:50%;transform:translateY(-50%);font-size:46px;z-index:2;filter:drop-shadow(0 2px 4px #000)}
.ropebar .fg{left:8px}.ropebar .fk{right:8px}
.rope .rib{position:absolute;left:50%;top:50%;width:18px;height:58px;margin:-29px 0 0 -9px;background:#e11d48;border-radius:4px;box-shadow:0 0 0 3px #fff}
.rlab{position:absolute;bottom:4px;font-size:13px;color:var(--muted)}
.task{font-size:clamp(32px,8vh,76px);font-weight:700;line-height:1.1;text-align:center}
.inp{font-size:clamp(26px,6vh,56px);min-height:1.25em;background:rgba(0,0,0,.3);border-radius:14px;padding:0 22px;min-width:170px;text-align:center;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px;width:100%;max-width:380px;flex:1;min-height:0}
.pad button{background:rgba(255,255,255,.13);border-radius:14px;font-size:clamp(22px,4.2vh,40px);font-weight:600;touch-action:none}
.pad button:active{background:rgba(255,255,255,.35)}
.pad button.okb{background:var(--acc);color:#05292b}
.lvrow{display:flex;gap:18px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.lvcol{display:flex;flex-direction:column;gap:6px;min-width:220px}
.lvh{font-weight:700;margin-bottom:2px;font-size:21px}.lvh.g{color:var(--g)}.lvh.k{color:var(--k)}
.lvb{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 12px;font-size:18px;border:3px solid transparent}
.lvb.on.g{border-color:var(--g);background:rgba(47,140,255,.3)}.lvb.on.k{border-color:var(--k);background:rgba(255,122,41,.3)}
/* Reaktion */
.rpad{flex:1;width:100%;border-radius:16px;display:grid;place-items:center;text-align:center;font-size:clamp(28px,7vh,66px);font-weight:700;background:rgba(0,0,0,.25);touch-action:none}
.rpad.wait{background:#7f1d1d}.rpad.go{background:#16a34a}.rpad.win{box-shadow:inset 0 0 0 8px var(--gold)}
.rpad small{display:block;font-size:.4em;font-weight:500;opacity:.85}
.dots{display:flex;gap:8px}.dots i{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.6)}.dots i.on{background:var(--gold);border-color:var(--gold)}
/* Blind */
.clock{font-size:clamp(44px,13vh,120px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.hint{color:#dbe4ff;font-size:18px;text-align:center}
.stopbtn{flex:1;width:100%;border-radius:20px;background:#475569;font-size:clamp(34px,9vh,80px);font-weight:700;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25);touch-action:none}
.stopbtn.start{background:#16a34a}.stopbtn.stop{background:#dc2626}
.res{font-size:clamp(20px,3.4vh,30px);font-weight:600;text-align:center}
/* Quiz-Duelle */
.prompt{flex:none;height:36%;min-height:110px;width:100%;border-radius:16px;display:grid;place-items:center;overflow:hidden;position:relative}
.prompt.light{background:#eef7f8;color:#0b1826}.prompt.dark{background:#121212}
.prompt svg{height:90%;width:auto;max-width:94%}
.prompt .flagp svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.prompt .flagp{height:90%;aspect-ratio:3/2;max-width:94%;display:grid;place-items:center}.prompt .flagp svg{height:100%;width:100%}
.emo{font-size:min(23vh,160px);line-height:1}.sil{filter:brightness(0)}
.cw{font-size:clamp(40px,10vh,100px);font-weight:700;letter-spacing:.04em}
.eye{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:14px;color:#335;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;width:100%;flex:1;min-height:0}
.opts button{background:rgba(255,255,255,.13);border-radius:14px;font-size:clamp(17px,3vh,28px);font-weight:600;padding:6px;touch-action:none;line-height:1.15;display:grid;place-items:center;min-height:0;overflow:hidden}
.opts.svgo button{background:#eef7f8}
.opts.svgo button svg{height:86%;max-width:92%}
.opts button.right{background:var(--ok)!important}.opts button.wrong{background:var(--bad)!important}
.score{font-size:22px;font-weight:600}
/* Zahlen */
.zf{flex:1;width:100%;position:relative;border-radius:14px;background:rgba(0,0,0,.22);min-height:0}
.zb{position:absolute;border-radius:14px;background:rgba(255,255,255,.17);font-weight:700;display:grid;place-items:center;touch-action:none;font-size:clamp(18px,3.4vh,34px)}
.zb.done{opacity:.12;pointer-events:none}.zb.bad{background:var(--bad)}
.nx{font-size:20px}
/* Schätzen */
.sbox{flex:none;height:42%;width:100%;border-radius:16px;background:#0a1220;display:grid;place-items:center;font-size:72px;font-weight:700;color:var(--acc)}
.sbox svg{width:96%;height:96%}
/* Bestenliste */
.board{height:100%;overflow:auto;padding:12px 18px 60px}
.bhead{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,36px);font-weight:700;font-size:clamp(30px,6vh,64px)}
.bhead .g{color:var(--g)}.bhead .k{color:var(--k)}.bhead .vs{color:var(--muted);font-size:.5em}
.tbar{height:14px;border-radius:7px;background:var(--k);overflow:hidden;margin:6px auto 6px;max-width:900px}
.tbar div{height:100%;background:var(--g);transition:width .6s}
.bsub{text-align:center;color:var(--acc);font-size:clamp(16px,2.3vh,22px);margin-bottom:12px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
@media (min-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--panel);border-radius:18px;padding:12px 16px;border:1px solid rgba(84,199,204,.2);cursor:pointer}
.card h3{margin:0;font-size:clamp(19px,2.7vh,26px)}
.card .sub{color:var(--muted);font-size:14px;margin-bottom:6px}
.rec{color:var(--gold);font-size:clamp(14px,2vh,18px);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;font-size:clamp(16px,2.4vh,24px);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row .r{width:1.9em;font-weight:700;color:var(--muted)}.row .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .v{font-variant-numeric:tabular-nums;font-weight:600}
.row .t{font-size:.65em;color:var(--muted);white-space:nowrap}
.row.p{background:linear-gradient(90deg,rgba(255,209,102,.13),transparent)}
.row .x{background:var(--bad);border-radius:8px;padding:2px 10px;font-size:16px}
.empty{color:var(--muted);font-size:16px;padding:6px 0}
.single{display:grid;grid-template-columns:2fr 1fr;gap:20px;max-width:1500px;margin:0 auto}
.single .card{cursor:default;padding:20px 26px}
.single h2{font-size:clamp(34px,6vh,64px);margin:0 0 12px;text-align:center}
.single .row{font-size:clamp(22px,4vh,42px);padding:7px 0}
.bigrec{font-size:clamp(26px,4.5vh,48px);font-weight:700;color:var(--gold);margin:8px 0}
.bctl{position:absolute;right:14px;bottom:12px;display:flex;gap:8px;z-index:6}
.ann{position:fixed;inset:0;display:grid;place-items:center;z-index:70;background:rgba(5,10,25,.88);text-align:center}
.annb{animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.annb .a1{font-size:clamp(40px,9vh,100px);font-weight:700;color:var(--gold)}
.annb .a2{font-size:clamp(34px,7vh,80px);font-weight:700;margin-top:10px}
.annb .a3{font-size:clamp(22px,4vh,40px);color:var(--acc);margin-top:8px}
@keyframes popin{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
/* Glücksrad */
.radw{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:12px}
.wheelbox{position:relative;width:min(66vh,86vw);aspect-ratio:1}
.wheel{width:100%;height:100%;transition:transform 5.5s cubic-bezier(.12,.62,.12,1)}
.wheel svg{width:100%;height:100%;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5))}
.ptr{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:44px solid var(--gold);z-index:2;filter:drop-shadow(0 3px 4px #000)}
.radres{font-size:clamp(26px,5vh,48px);font-weight:700;min-height:1.3em;color:var(--gold)}
/* Overlay */
.ov{position:fixed;inset:0;background:rgba(5,10,25,.8);display:grid;place-items:center;z-index:50;padding:16px}
.ovb{background:var(--panel2);border-radius:26px;padding:24px 30px;width:min(640px,94vw);text-align:center;border:2px solid var(--acc);max-height:94vh;overflow:auto}
.ovb h2{font-size:clamp(30px,5.5vh,50px);margin:0 0 6px}
.ovb .sub{font-size:21px;margin:0 0 10px;color:#e3e9fb}.det{color:var(--muted);font-size:17px;margin:0 0 12px}
.stamp{background:var(--acc);color:#05292b;border-radius:16px;padding:12px;font-size:28px;font-weight:700;margin:8px 0 12px}
.prize{background:var(--gold);color:#2b1d00;border-radius:16px;padding:12px;font-size:32px;font-weight:700;margin:10px 0 4px;animation:popin .5s}
.drec{color:var(--gold);font-size:22px;font-weight:700;margin-top:8px}
.nb{background:rgba(0,0,0,.25);border-radius:16px;padding:14px;margin:8px 0 14px;font-size:19px}
.nr{display:flex;gap:10px;margin-top:10px}
.nr input{flex:1;min-width:0;font-size:21px;padding:10px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:#0a1626;color:#fff;user-select:text;-webkit-user-select:text}
.btn{background:var(--acc);color:#05292b;border-radius:14px;padding:12px 20px;font-size:20px;font-weight:600}
.btn.big{font-size:24px;padding:14px 30px}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}.btn.red{background:var(--bad);color:#fff}
.ovbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.warnl{color:#fca5a5;font-size:17px;margin:6px 0}
.hold{position:relative;overflow:hidden}.hold .hf{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.4)}
.hold.on .hf{width:100%;transition:width 3s linear}.hold .ht{position:relative}
.pinv{font-size:40px;letter-spacing:12px;min-height:56px;margin:6px 0 12px}
.pinpad{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center}
.pinpad button{background:rgba(255,255,255,.13);border-radius:14px;height:70px;font-size:28px;font-weight:600}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
/* Einstellungen */
.set{height:100%;overflow:auto;padding:16px}
.setin{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grp{background:var(--panel);border-radius:18px;padding:12px 18px}
.grp h3{margin:0 0 8px;font-size:21px;color:var(--acc)}
.fr{display:grid;grid-template-columns:1fr 230px;gap:10px;align-items:center;padding:5px 0;font-size:17px}
.fr input,.fr select,.grp textarea{padding:8px 10px;border-radius:10px;border:2px solid rgba(255,255,255,.18);background:#0a1626;color:#fff;font-size:17px;width:100%;user-select:text;-webkit-user-select:text}
.fr small{color:var(--muted);display:block;font-size:13px}
.logoprev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 18px;border-radius:12px;font-size:17px;z-index:90;pointer-events:none;text-align:center;max-width:90vw}
.rot{display:none}
@media (orientation:portrait) and (max-width:1000px){.game .rot{display:grid;position:absolute;inset:0;z-index:40;background:rgba(11,24,38,.97);place-items:center;text-align:center;font-size:26px;padding:30px}}
/* TTT + OSK */
.tttw{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;padding:12px;align-items:stretch;min-height:0}
.tside{border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:.55;transition:opacity .2s}
.tside.g{background:linear-gradient(180deg,#173a73,#10264d);border:3px solid var(--g)}.tside.k{background:linear-gradient(180deg,#6b2f10,#45200b);border:3px solid var(--k)}
.tside.act{opacity:1;box-shadow:0 0 0 5px var(--gold)}
.tsym{font-size:min(14vh,110px);font-weight:700;line-height:1.15;margin-bottom:6px}.tside.g .tsym{color:#9cc8ff}.tside.k .tsym{color:#ffc29b}
.tturn{font-size:26px;font-weight:700;color:var(--gold);min-height:1.3em}
.tboard{height:100%;max-height:calc(100vh - 110px);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;align-self:center}
.tc{background:#eef7f8;border-radius:18px;font-size:min(13vh,100px);font-weight:700;touch-action:none;line-height:1}
.tc.g{color:var(--g)}.tc.k{color:var(--k)}.tc.old{opacity:.3}.tc.win{background:var(--gold)}
.osk{margin-top:10px;display:flex;flex-direction:column;gap:6px}.okr{display:flex;gap:5px;justify-content:center}
.osk button{background:rgba(255,255,255,.14);border-radius:9px;height:46px;font-size:20px;font-weight:600;flex:1;max-width:52px;touch-action:none}
.osk button.wide{max-width:none;flex:5}
/* v4 */
.game,.game *{touch-action:none}
.fzp{text-align:center;line-height:1}.fzl{font-size:clamp(14px,2.2vh,20px);color:var(--muted);margin-bottom:8px;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.fzs{font-size:clamp(56px,14vh,130px);font-weight:600;color:#fff}.fzs.it{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-weight:400}
.mgrid{height:100%;max-height:calc(100vh - 110px);aspect-ratio:5/4;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:9px;align-self:center}
.mcard{border-radius:14px;background:linear-gradient(135deg,#1d6b6f,#13283b);border:3px solid var(--acc);font-size:min(9vh,64px);font-weight:600;color:#0b1826;touch-action:none;position:relative}
.mcard span{visibility:hidden}.mcard.up{background:#eef7f8}.mcard.up span{visibility:visible}

function results(){return (dbOK&&dbResults)?dbResults:localResults}
function clean(x){x=x||{};return{id:String(x.id||''),game:String(x.game||''),winner:String(x.winner||''),value:(typeof x.value==='number'&&isFinite(x.value))?x.value:null,name:typeof x.name==='string'?x.name.slice(0,20):'',ts:+x.ts||0,devName:typeof x.dev_name==='string'?x.dev_name.slice(0,30):(typeof x.devName==='string'?x.devName:'')}}
async function sb(path,opt={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',headers:Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},SB_KEY.startsWith('sb_')?{}:{Authorization:'Bearer '+SB_KEY},opt.headers||{}),body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();return t?JSON.parse(t):null}
const row=r=>({id:r.id,game:r.game,winner:r.winner,value:r.value,name:r.name,ts:r.ts,dev_name:r.devName||'',dev:DEV});
async function pushDb(r){if(!SB_ON)return false;try{await sb('results?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:[row(r)]});return true}catch(e){return false}}
async function record(r){
  localResults.unshift(r);if(localResults.length>3000)localResults.length=3000;LS.set('results',localResults);
  let ok=true;
  if(SB_ON){ok=await pushDb(r);if(ok){if(dbResults)dbResults.unshift(r)}else{pending.push(r);LS.set('pending',pending);renderTop()}}
  refresh();return ok;
}
async function setName(id,name){
  const l=localResults.find(r=>r.id===id);if(l){l.name=name;LS.set('results',localResults)}
  const p=pending.find(r=>r.id===id);if(p){p.name=name;LS.set('pending',pending)}
  if(dbResults){const d=dbResults.find(r=>r.id===id);if(d)d.name=name}
  let ok=true;
  if(SB_ON&&!p){try{await sb('results?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:{name}})}catch(e){ok=false;if(l){pending.push(l);LS.set('pending',pending);renderTop()}}}
  refresh();return ok;
}
async function delResult(id){
  localResults=localResults.filter(r=>r.id!==id);LS.set('results',localResults);
  pending=pending.filter(r=>r.id!==id);LS.set('pending',pending);
  if(dbResults)dbResults=dbResults.filter(r=>r.id!==id);
  if(SB_ON){try{await sb('results?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}catch(e){toast('Löschen in der gemeinsamen Liste hat nicht geklappt.')}}
  refresh();
}
async function resetAll(){
  localResults=[];pending=[];LS.set('results',[]);LS.set('pending',[]);
  if(SB_ON){try{await sb('results?ts=gte.0',{method:'DELETE'})}catch(e){toast('Löschen in der gemeinsamen Liste hat nicht geklappt.')}}

}
async function flushPending(){if(!SB_ON||!pending.length)return;for(const r of pending.slice()){if(await pushDb(r)){pending=pending.filter(x=>x.id!==r.id)}else break}LS.set('pending',pending);renderTop()}

const dayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const winStart=()=>Math.max(Date.now()-WIN()*60000,+CFG.clearedAt||0,dayStart());
function winList(game){const ws=winStart();return results().filter(r=>r.game===game&&typeof r.value==='number'&&r.ts>=ws).sort((a,b)=>a.value-b.value||a.ts-b.ts)}
function dayRecord(game){const ds=dayStart();let b=null;for(const r of results())if(r.game===game&&typeof r.value==='number'&&r.ts>=ds&&(!b||r.value<b.value||(r.value===b.value&&r.ts<b.ts)))b=r;return b}
function tally(game){const ds=dayStart();let g=0,k=0;for(const r of results()){if(r.ts<ds)continue;if(game&&r.game!==game)continue;if(r.winner==='g')g++;else if(r.winner==='k')k++}return{g,k}}

function applyCfg(d){
  let ch=false;const set=(k,v)=>{if(JSON.stringify(CFG[k])!==JSON.stringify(v)){CFG[k]=v;ch=true}};
  for(const k of ['title','subtitle','gName','kName','logo','pin','sitepw'])if(typeof d[k]==='string')set(k,d[k]);
  for(const k of ['win','clearedAt'])if(typeof d[k]==='number'&&isFinite(d[k]))set(k,d[k]);
  for(const k of ['rotate','enabled','osk'])if(typeof d[k]==='boolean')set(k,d[k]);
  if(d.game&&typeof d.game==='object')for(const k in DEF){if(typeof d.game[k]===typeof DEF[k]&&S[k]!==d.game[k]){S[k]=d.game[k];ch=true}}
  if(ch){LS.set('cfg3',CFG);LS.set('game3',S)}
  return ch;
}

function finish(game,winner,value,detail){
  const id=uid();const v=(typeof value==='number'&&isFinite(value))?Math.round(value*1000)/1000:null;
  const before=dayRecord(game);const wl=winList(game);
  const rank=v!=null?wl.filter(r=>r.value<=v).length+1:null;
  const special=rank!=null&&rank<=3,dayRec=v!=null&&(!before||v<before.value);
  const rec={id,game,winner,value:v,name:'',ts:Date.now(),devName:DEVNAME};
  record(rec).then(ok=>{if(!ok){const w=$('#svw');if(w)w.innerHTML='⚠️ Ergebnis konnte nicht in die gemeinsame Bestenliste übertragen werden. Es wird automatisch erneut versucht.'}});
  const gw=winner==='g';
  if(dayRec||gw)fanfare();else if(gw)beep(880,.2,'triangle');else beep(300,.3,'triangle');
  const title=winner==='draw'?'🤝 Unentschieden!':gw?'🎉 Gewonnen!':`💪 Die ${esc(CFG.kName)} gewinnt!`;
  const sub=winner==='draw'?'Das schreit nach einer Revanche!':gw?'':'Knapp! Revanche?';
  const o=openOv(`<h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}${detail?`<p class="det">${detail}</p>`:''}
  ${gw?'<div class="stamp">🎉 Super! Hol dir deinen Gewinner-Stempel!</div>':''}
  ${v!=null?`<div class="nb">${esc(GAMES[game].label)} (${esc(CFG.gName)}): <b>${GAMES[game].fmt(v)}</b><br>Platz <b>${rank}</b> der letzten ${WIN()} Minuten
    ${dayRec?'<div class="drec">⭐ Neuer Tagesrekord!</div>':''}
    <div class="nr"><input id="nm" maxlength="14" placeholder="Vorname für die Bestenliste" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"${CFG.osk?' readonly inputmode="none"':''}><button class="btn" id="nmok">Eintragen</button></div>${CFG.osk?oskHtml():''}<div id="nmr"></div></div>`:''}
  <div class="warnl" id="svw"></div>
  <div class="ovbtns"><button class="btn big" id="again">Nochmal</button>${(ROLE==='tablet'&&LOCK)?'':'<button class="btn ghost" id="tomenu">Menü</button>'}</div>`);
  $('#again',o).onclick=()=>go(game);const tm=$('#tomenu',o);if(tm)tm.onclick=()=>go('menu');
  const ok=$('#nmok',o);
  if(ok){const inp=$('#nm',o);const sub2=async()=>{const n=inp.value.replace(/\s+/g,' ').trim().slice(0,14);if(!n){inp.focus();return}
    inp.disabled=true;ok.disabled=true;ok.style.opacity=.5;const r=await setName(id,n);
    $('#nmr',o).innerHTML=r?'<div class="drec">✓ Eingetragen!</div>':'<div class="warnl">⚠️ Name konnte nicht übertragen werden – wird erneut versucht.</div>';beep(880,.15)};
    ok.onclick=sub2;inp.addEventListener('keydown',e=>{if(e.key==='Enter')sub2()});if(CFG.osk)oskBind(o,inp,sub2)}
}

const LV=['','Plus/Minus bis 20','Plus/Minus bis 100','Einmaleins','Grundschul-Mix','Klasse 7','Profi'];
function task(l){
  if(l===1){if(Math.random()<.5){const a=rnd(1,10),b=rnd(1,10);return{q:`${a} + ${b}`,a:a+b}}const a=rnd(6,20),b=rnd(1,a-1);return{q:`${a} − ${b}`,a:a-b}}
  if(l===2){if(Math.random()<.5){const a=rnd(10,80),b=rnd(5,100-a);return{q:`${a} + ${b}`,a:a+b}}const a=rnd(25,100),b=rnd(5,a-5);return{q:`${a} − ${b}`,a:a-b}}

  if(l===5){const r=rnd(1,5);

  const r=rnd(1,4);

  if(r===3){const n=rnd(15,30);return{q:`${n}²`,a:n*n}}

/* ---------- Reaktionsduell ---------- */
function vReak(el){
  const need=Math.max(1,+S.rkWins||2),hc=Math.max(0,+S.rkHandicap||0);
  const score={g:0,k:0};let best=null,phase='idle',tGo=0,times={},foul={},rid=0;
  el.innerHTML=`<div class="game"><div class="split">${['g','k'].map(s=>`<div class="side ${s}"><div class="sh">${esc(team(s))}${s==='k'&&hc?` <span class="tag">+${hc} ms Handicap</span>`:''}</div><div class="dots" id="dt-${s}"></div><div class="rpad" id="pd-${s}">Finger bereit!</div></div>`).join('')}</div><div class="center" id="ctr"></div>${ROT}</div>`;
  const ctr=$('#ctr',el);
  const dots=()=>['g','k'].forEach(s=>$('#dt-'+s,el).innerHTML=Array.from({length:need},(_,i)=>`<i class="${i<score[s]?'on':''}"></i>`).join(''));
  const pads=(cls,txt)=>['g','k'].forEach(s=>{const p=$('#pd-'+s,el);p.className='rpad '+cls;p.innerHTML=txt});
  function startRound(){ctr.innerHTML='';phase='wait';times={g:null,k:null};foul={};const my=++rid;pads('wait','Warten…');
    later(()=>{if(phase!=='wait'||my!==rid)return;phase='go';tGo=now();pads('go','JETZT!');beep(880,.15,'square',.12);
      later(()=>{if(phase==='go'&&my===rid)endRound()},2500)},rnd(1500,4500))}
  function tap(s){
    if(phase==='wait'){foul[s]=true;endRound();return}
    if(phase==='go'&&times[s]==null){times[s]=now()-tGo;const p=$('#pd-'+s,el);p.className='rpad';p.innerHTML=`${Math.round(times[s])} ms`;
      const my=rid;if(times.g!=null&&times.k!=null)endRound();else later(()=>{if(phase==='go'&&my===rid)endRound()},900)}}
  function endRound(){if(phase==='end'||phase==='idle')return;phase='end';let w=null,msg='';
    if(foul.g||foul.k){const f=foul.g?'g':'k';w=f==='g'?'k':'g';msg=`Fehlstart von ${esc(team(f))}!`;beep(150,.3,'square',.1);
      const p=$('#pd-'+f,el);p.className='rpad';p.innerHTML='Zu früh! ✋';const o=$('#pd-'+w,el);o.className='rpad win';o.innerHTML='Punkt!'}
    else{const g=times.g,k=times.k!=null?times.k+hc:null;
      if(g==null&&k==null)msg='Keiner hat getippt!';
      else if(k==null||(g!=null&&g<k))w='g';else if(g==null||k<g)w='k';else msg='Exakt gleich schnell!';
      ['g','k'].forEach(s=>{const p=$('#pd-'+s,el);p.className='rpad'+(s===w?' win':'');
        p.innerHTML=times[s]==null?'–':`${Math.round(times[s])} ms${s==='k'&&hc?`<small>mit Handicap ${Math.round(times[s]+hc)} ms</small>`:''}`});
      if(g!=null)best=best==null?g:Math.min(best,g);
      if(w)msg=`Runde für ${esc(team(w))}!`;}
    if(w){score[w]++;dots();beep(w==='g'?760:520,.12)}
    if(w&&score[w]>=need){later(()=>finish('reaktion',w,best,`Endstand ${score.g} : ${score.k} · Beste Reaktion ${esc(CFG.gName)}: ${best!=null?Math.round(best)+' ms':'–'}`),1300);return}
    later(()=>{ctr.innerHTML=`<div class="msg">${msg}<button class="bigbtn" id="nx">Nächste Runde</button></div>`;$('#nx',ctr).onclick=startRound},700)}
  ['g','k'].forEach(s=>$('#pd-'+s,el).addEventListener('pointerdown',e=>{e.preventDefault();tap(s)}));
  dots();
  intro(ctr,'⚡ Reaktionsduell',`Finger über euer Feld halten. Sobald es <b style="color:#4ade80">GRÜN</b> wird: so schnell wie möglich tippen! Wer zu früh tippt, verliert die Runde. Wer zuerst ${need} Runde${need>1?'n':''} gewinnt, siegt.`,'Start!',startRound);
}

/* ---------- Blind-Stopp (nacheinander) ---------- */
function vBlind(el){
  const T=Math.max(2,+S.blTarget||10),vis={g:Math.max(0,+S.blVisG),k:Math.max(0,+S.blVisK)};
  const st={g:'wait',k:'wait'},stop={g:null,k:null},t0={};
  el.innerHTML=`<div class="game"><div class="split">${['g','k'].map(s=>`<div class="side ${s}" id="sd-${s}"><div class="sh">${esc(team(s))} <span class="tag">Uhr ${num(vis[s],vis[s]%1?1:0)} s sichtbar</span></div><div class="hint">Stoppe bei genau <b>${T} Sekunden</b></div><div class="clock" id="ck-${s}">0,00</div><div class="res" id="rs-${s}"></div><button class="stopbtn" id="sb-${s}">–</button>${s==='k'?`<div class="cover" id="cv">⏳<br>Gleich bist du dran!<br><small style="font-size:18px;color:var(--muted)">Erst spielen die ${esc(CFG.gName)}.</small></div>`:''}</div>`).join('')}</div><div class="center" id="ctr"></div>${ROT}</div>`;
  const ctr=$('#ctr',el);
  const btn=(s,cls,txt)=>{const b=$('#sb-'+s,el);b.className='stopbtn '+cls;b.textContent=txt};
  btn('g','','–');btn('k','','–');
  function ready(s){st[s]='ready';btn(s,'start','START');$('#ck-'+s,el).textContent='0,00';if(s==='k'){const c=$('#cv',el);if(c)c.remove()}}
  function loop(s){if(st[s]!=='run')return;const e=(now()-t0[s])/1000;$('#ck-'+s,el).textContent=e<vis[s]?num(e,2):'? ? ?';rafId=requestAnimationFrame(()=>loop(s))}
  function press(s){
    if(st[s]==='ready'){st[s]='run';t0[s]=now();btn(s,'stop','STOP');beep(660,.08);loop(s);later(()=>{if(st[s]==='run')done(s,null)},T*2500)}
    else if(st[s]==='run'){done(s,(now()-t0[s])/1000)}}
  function done(s,v){st[s]='done';stop[s]=v;cancelAnimationFrame(rafId);btn(s,'','✓');$('#ck-'+s,el).textContent=v==null?'–':'✋';$('#rs-'+s,el).textContent=v==null?'nicht gestoppt':'gestoppt – Ergebnis gleich!';beep(600,.08);
    if(s==='g')later(()=>ready('k'),700);else later(reveal,600)}
  function reveal(){const dev=s=>stop[s]==null?Infinity:Math.abs(stop[s]-T);
    ['g','k'].forEach(s=>{const v=stop[s];$('#ck-'+s,el).textContent=v==null?'–':num(v,2)+' s';$('#rs-'+s,el).innerHTML=v==null?'nicht gestoppt':`${v>=T?'+':'−'} ${num(Math.abs(v-T),2)} s daneben`});
    const dg=dev('g'),dk=dev('k');let w;if(!isFinite(dg)&&!isFinite(dk))w='draw';else if(Math.abs(dg-dk)<.005)w='draw';else w=dg<dk?'g':'k';
    later(()=>finish('blind',w,isFinite(dg)?dg:null,`${esc(CFG.gName)}: ${stop.g!=null?num(stop.g,2)+' s':'–'} · ${esc(CFG.kName)}: ${stop.k!=null?num(stop.k,2)+' s':'–'}`),2000)}
  ['g','k'].forEach(s=>$('#sb-'+s,el).addEventListener('pointerdown',e=>{e.preventDefault();press(s)}));
  intro(ctr,'⏱️ Blind-Stopp',`Erst sind die <b>${esc(CFG.gName)}</b> dran, danach die <b>${esc(CFG.kName)}</b>. START drücken – die Uhr ist nur kurz sichtbar. STOP drücken, wenn genau <b>${T} Sekunden</b> vorbei sind. Wer näher dran ist, gewinnt.`,'Los geht’s!',()=>{ctr.innerHTML='';ready('g')});
}

function quizDuel(el,c){

  const ctr=$('#ctr',el);
  const sc=()=>['g','k'].forEach(s=>$('#sc-'+s,el).textContent=`${score[s]} / ${need[s]}`);
  function next(){cur=c.makeRound(round++);locked={g:false,k:false};
    ['g','k'].forEach(s=>{const idx=cur.opts.map((_,i)=>i);if(!(cur.fixed&&cur.fixed[s]))shuffle(idx);
      $('#pr-'+s,el).innerHTML=cur.prompt[s];$('#sd-'+s,el).classList.remove('locked');
      $('#op-'+s,el).innerHTML=idx.map(i=>`<button data-i="${i}">${cur.opts[i].h}</button>`).join('')});phase='q'}

    if(o.ok){phase='rev';score[s]++;sc();markRight();beep(s==='g'?760:600,.1);
      if(score[s]>=need[s]){const secs=(now()-t0)/1000;later(()=>finish(c.id,s,s==='g'?secs:null,`${c.mode?c.mode+' · ':''}Endstand ${score.g} : ${score.k} · Zeit ${num(secs,1)} s`),1000)}
      else later(next,1000)}
    else{b.classList.add('wrong');locked[s]=true;$('#sd-'+s,el).classList.add('locked');beep(160,.2,'square',.08);
      if(locked.g&&locked.k){phase='rev';markRight();later(next,1400)}}}
  ['g','k'].forEach(s=>$('#op-'+s,el).addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-i]');if(!b)return;e.preventDefault();choose(s,b)}));
  const go2=()=>countdown(ctr,()=>{t0=now();next()});if(c.auto)go2();else intro(ctr,c.title,c.text,'Start!',go2);
}

/* ---------- Würfel-Blick ---------- */
const WC=['#e63946','#3a86ff','#ffbe0b','#38b000'];
function wbStruct(r){const [W,D,H]=r<2?[2,2,2]:r<4?[3,2,2]:[3,3,3];
  for(let t=0;t<200;t++){const h=[],c={};let tot=0;
    for(let x=0;x<W;x++){h[x]=[];for(let y=0;y<D;y++){const v=Math.random()<.22?0:rnd(1,H);h[x][y]=v;tot+=v;for(let z=0;z<v;z++)c[x+','+y+','+z]=rnd(0,3)}}
    const s={W,D,H,h,c};const f=wbView(s,'front');let filled=0;f.cells.forEach(row=>row.forEach(v=>{if(v!=null)filled++}));
    if(tot>=3&&filled>=3)return s}
  return null}
function wbView(s,dir){const{W,D,H,h,c}=s;const cells=[];
  const w=dir==='right'?D:W;
  for(let z=0;z<H;z++){cells[z]=[];for(let i=0;i<w;i++){let col=null;
    if(dir==='front'){const x=i;for(let y=0;y<D;y++)if(h[x][y]>z){col=c[x+','+y+','+z];break}}
    else if(dir==='back'){const x=W-1-i;for(let y=D-1;y>=0;y--)if(h[x][y]>z){col=c[x+','+y+','+z];break}}
    else{const y=i;for(let x=W-1;x>=0;x--)if(h[x][y]>z){col=c[x+','+y+','+z];break}}
    cells[z][i]=col}}
  return{w,H,cells}}
const vkey=v=>JSON.stringify(v.cells);
function mutColor(v){const n=JSON.parse(JSON.stringify(v));const f=[];n.cells.forEach((r,z)=>r.forEach((x,i)=>{if(x!=null)f.push([z,i])}));if(!f.length)return n;const[z,i]=pick(f);let k;do{k=rnd(0,3)}while(k===n.cells[z][i]);n.cells[z][i]=k;return n}
function mutShape(v){const n=JSON.parse(JSON.stringify(v));const i=rnd(0,n.w-1);let top=-1;for(let z=0;z<n.H;z++)if(n.cells[z][i]!=null)top=z;
  if(top<n.H-1&&(top<0||Math.random()<.5)){n.cells[top+1][i]=rnd(0,3)}else if(top>=0){n.cells[top][i]=null}return n}
function svgView(v){const s=20;let o='';for(let z=0;z<v.H;z++)for(let i=0;i<v.w;i++){const col=v.cells[z][i];const x=i*s,y=(v.H-1-z)*s;
  o+=col==null?`<rect x="${x+1}" y="${y+1}" width="${s-2}" height="${s-2}" fill="none" stroke="#c9d6dc" stroke-width="1" stroke-dasharray="2 2"/>`:`<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${WC[col]}" stroke="#1d2a33" stroke-width="1.2"/>`}
  o+=`<line x1="-3" y1="${v.H*s+1}" x2="${v.w*s+3}" y2="${v.H*s+1}" stroke="#1d2a33" stroke-width="2"/>`;
  return `<svg viewBox="-5 -3 ${v.w*s+10} ${v.H*s+8}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=v=>Math.max(0,Math.min(255,Math.round(f>0?v+(255-v)*f:v*(1+f))));return `rgb(${m(r)},${m(g)},${m(b)})`}
function svgIso(st){const s=20,dx=6.5,dy=6.5;const{W,D,H,h,c}=st;let o='';
  for(let x=0;x<W;x++){const p=[[x*s,0],[x*s+s,0],[x*s+s+D*dx,-D*dy],[x*s+D*dx,-D*dy]];}
  o+=`<polygon points="0,0 ${W*s},0 ${W*s+D*dx},${-D*dy} ${D*dx},${-D*dy}" fill="#d5e3e8" stroke="#9fb3bd" stroke-width="1"/>`;
  for(let y=D-1;y>=0;y--)for(let z=0;z<H;z++)for(let x=0;x<W;x++){if(h[x][y]<=z)continue;const col=WC[c[x+','+y+','+z]];
    const bx=x*s+y*dx,by=-z*s-y*dy;
    o+=`<polygon points="${bx},${by-s} ${bx+s},${by-s} ${bx+s+dx},${by-s-dy} ${bx+dx},${by-s-dy}" fill="${shade(col,.35)}" stroke="#1d2a33" stroke-width=".9"/>`;
    o+=`<polygon points="${bx+s},${by} ${bx+s},${by-s} ${bx+s+dx},${by-s-dy} ${bx+s+dx},${by-dy}" fill="${shade(col,-.3)}" stroke="#1d2a33" stroke-width=".9"/>`;
    o+=`<rect x="${bx}" y="${by-s}" width="${s}" height="${s}" fill="${col}" stroke="#1d2a33" stroke-width=".9"/>`}
  const minY=-(H*s+D*dy)-4,wid=W*s+D*dx+8;
  o+=`<text x="${W*s/2}" y="14" text-anchor="middle" font-size="9" font-family="sans-serif" font-weight="700" fill="#1d2a33">▲ 👁 vorne</text>`;
  return `<svg viewBox="-4 ${minY} ${wid} ${-minY+20}" xmlns="http://www.w3.org/2000/svg">${o}</svg>`}
function vWuerfel(el){
  const n=Math.max(1,+S.wbN||5);

    text:`Oben seht ihr einen Würfelbau. Welches Bild zeigt, was man <b>von vorne</b> sieht (Auge 👁)? Wer zuerst richtig tippt, punktet. Die Bauten werden immer größer! Wer zuerst <b>${n}</b> Punkte hat, gewinnt.`,
    makeRound:r=>{const st=wbStruct(r);const f=wbView(st,'front');const fk=vkey(f);
      const cands=[wbView(st,'back'),wbView(st,'right'),mutColor(f),mutShape(f),mutColor(f),mutShape(f),mutColor(mutShape(f))];
      const seen=new Set([fk]);const wrong=[];for(const v of cands){const k=vkey(v);if(!seen.has(k)&&!v.cells.every(r=>r.every(x=>x==null))){seen.add(k);wrong.push(v)}if(wrong.length===3)break}
      while(wrong.length<3){const v=mutColor(mutColor(f));const k=vkey(v);if(!seen.has(k)){seen.add(k);wrong.push(v)}}
      const p=svgIso(st);return{prompt:{g:p,k:p},opts:[{h:svgView(f),ok:true},...wrong.map(v=>({h:svgView(v),ok:false}))]}}});

  function layout(s){const n=N[s];const cols=Math.ceil(Math.sqrt(n*1.5)),rows=Math.ceil(n*1.25/cols);const cells=shuffle(Array.from({length:cols*rows},(_,i)=>i)).slice(0,n);

      return `<button class="zb" data-n="${i+1}" style="left:${(c*w+w*.08+Math.random()*w*.08).toFixed(2)}%;top:${(r*h+h*.08+Math.random()*h*.08).toFixed(2)}%;width:${(w*.8).toFixed(2)}%;height:${(h*.8).toFixed(2)}%">${i+1}</button>`}).join('')}
  function tap(s,b){if(!running||lock[s])return;const v=+b.dataset.n;
    if(v===nextN[s]){b.classList.add('done');nextN[s]++;beep(500+nextN[s]*15,.05);
      if(nextN[s]>N[s]){running=false;const secs=(now()-t0)/1000;$('#nx-'+s,el).textContent='Fertig! 🎉';
        later(()=>finish('zahlen',s,s==='g'?secs:null,`${esc(team(s))} war zuerst fertig · ${num(secs,1)} s`),600)}
      else $('#nx-'+s,el).textContent='Nächste: '+nextN[s]}
    else{lock[s]=true;b.classList.add('bad');beep(160,.15,'square',.08);later(()=>{b.classList.remove('bad');lock[s]=false},600)}}
  ['g','k'].forEach(s=>{layout(s);$('#zf-'+s,el).addEventListener('pointerdown',e=>{const b=e.target.closest('.zb');if(!b)return;e.preventDefault();tap(s,b)});$('#zf-'+s,el).style.visibility='hidden'});
  intro(ctr,'🔢 Zahlen-Jagd',`Tippt die Zahlen der Reihe nach an: 1, 2, 3 … Wer zuerst fertig ist, gewinnt! ${esc(CFG.gName)}: 1 bis <b>${N.g}</b>, ${esc(CFG.kName)}: 1 bis <b>${N.k}</b>. Falsch getippt = kurz gesperrt.`,'Start!',
    ()=>countdown(ctr,()=>{['g','k'].forEach(s=>$('#zf-'+s,el).style.visibility='visible');running=true;t0=now()}));
}

/* ---------- Schätz-Duell ---------- */
function dotsSvg(n){const pts=[];let tries=0;while(pts.length<n&&tries<6000){tries++;const x=4+Math.random()*92,y=4+Math.random()*62;if(pts.every(p=>(p[0]-x)**2+(p[1]-y)**2>42))pts.push([x,y])}
  return `<svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#54c7cc"/>`).join('')}</svg>`}
function vSchaetz(el){
  const need=Math.max(1,+S.seN||3),show=Math.max(.3,+S.seShow||1.2);const RG={g:[5,20],k:[10,30]};
  const score={g:0,k:0},errs={g:[],k:[]};let phase='idle',truth={},inp={g:'',k:''},sub={},rid=0;
  el.innerHTML=`<div class="game"><div class="split">${['g','k'].map(s=>`<div class="side ${s}" id="sd-${s}"><div class="sh">${esc(team(s))} <span class="score" id="sc-${s}">0 / ${need}</span> <span class="tag">${RG[s][0]}–${RG[s][1]} Punkte</span></div><div class="sbox" id="bx-${s}">?</div><div class="inp" id="in-${s}">&nbsp;</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(x=>`<button data-k="${x}"${x==='✓'?' class="okb"':''}>${x}</button>`).join('')}</div></div>`).join('')}</div><div class="center" id="ctr"></div>${ROT}</div>`;
  const ctr=$('#ctr',el);
  const sc=()=>['g','k'].forEach(s=>$('#sc-'+s,el).textContent=`${score[s]} / ${need}`);
  const showIn=s=>$('#in-'+s,el).innerHTML=inp[s]?esc(inp[s]):'&nbsp;';
  function round(){ctr.innerHTML='';const my=++rid;phase='show';inp={g:'',k:''};sub={};
    ['g','k'].forEach(s=>{truth[s]=rnd(RG[s][0],RG[s][1]);$('#bx-'+s,el).innerHTML=dotsSvg(truth[s]);showIn(s);$('#sd-'+s,el).classList.remove('locked')});
    later(()=>{if(my!==rid)return;['g','k'].forEach(s=>$('#bx-'+s,el).textContent='?');phase='input';beep(520,.08);
      later(()=>{if(phase==='input'&&my===rid)reveal()},20000)},show*1000)}
  function key(s,k){if(phase!=='input'||sub[s]!=null)return;
    if(k==='⌫'){inp[s]=inp[s].slice(0,-1)}else if(k==='✓'){if(!inp[s])return;sub[s]=+inp[s];$('#sd-'+s,el).classList.add('locked');$('#in-'+s,el).innerHTML='✓ '+esc(inp[s]);beep(600,.06);if(sub.g!=null&&sub.k!=null)reveal();return}
    else if(inp[s].length<3)inp[s]+=k;showIn(s)}
  function reveal(){phase='rev';const e={};['g','k'].forEach(s=>{const v=sub[s];e[s]=v==null?100:Math.min(100,Math.abs(v-truth[s])/truth[s]*100);errs[s].push(e[s]);
      $('#sd-'+s,el).classList.remove('locked');$('#bx-'+s,el).innerHTML=`<div style="font-size:.55em;text-align:center">Richtig: ${truth[s]}<br><span style="font-size:.6em;color:#fff">Du: ${v==null?'–':v} · ${num(e[s],0)} % daneben</span></div>`});
    let w=null;if(Math.abs(e.g-e.k)>=.5)w=e.g<e.k?'g':'k';
    if(w){score[w]++;sc();beep(w==='g'?760:600,.12)}
    const avg=errs.g.reduce((a,b)=>a+b,0)/errs.g.length;
    if(w&&score[w]>=need){later(()=>finish('schaetzen',w,avg,`Endstand ${score.g} : ${score.k} · ${esc(CFG.gName)} im Schnitt ${num(avg,0)} % daneben`),2200);return}
    later(()=>{ctr.innerHTML=`<div class="msg">${w?`Punkt für ${esc(team(w))}!`:'Gleich gut geschätzt!'}<button class="bigbtn" id="nx">Nächste Runde</button></div>`;$('#nx',ctr).onclick=round},1800)}
  ['g','k'].forEach(s=>$('#sd-'+s,el).addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-k]');if(!b)return;e.preventDefault();key(s,b.dataset.k)}));
  intro(ctr,'🔵 Schätz-Duell',`Für ${num(show,1)} Sekunden blitzen Punkte auf. Schätzt, wie viele es waren, tippt die Zahl ein und drückt ✓. Wer prozentual näher dran ist, bekommt den Punkt. Die ${esc(CFG.kName)} bekommt mehr Punkte zu sehen. Wer zuerst <b>${need}</b> Punkte hat, gewinnt.`,'Start!',()=>countdown(ctr,round));
}

/* ---------- Tic-Tac-Toe ---------- */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function vTTT(el){
  let hard=false,started=false,over=false,turn='g';const cells=Array(9).fill(null),hist={g:[],k:[]};
  el.innerHTML=`<div class="game"><div class="tttw"><div class="tside g" id="ts-g"><div class="tsym">✕</div><div class="sh">${esc(CFG.gName)}</div><div class="tturn" id="tt-g"></div></div><div class="tboard" id="tb">${cells.map((_,i)=>`<button class="tc" data-i="${i}"></button>`).join('')}</div><div class="tside k" id="ts-k"><div class="tsym">◯</div><div class="sh">${esc(CFG.kName)}</div><div class="tturn" id="tt-k"></div></div></div><div class="center" id="ctr"></div>${ROT}</div>`;
  const ctr=$('#ctr',el),tcs=$$('.tc',el);
  function draw(){tcs.forEach((b,i)=>{const v=cells[i];b.textContent=v==='g'?'✕':v==='k'?'◯':'';b.className='tc'+(v?' '+v:'')});
    if(hard&&!over&&hist[turn].length===3)tcs[hist[turn][0]].classList.add('old');
    ['g','k'].forEach(s=>{$('#ts-'+s,el).classList.toggle('act',started&&turn===s&&!over);$('#tt-'+s,el).textContent=started&&turn===s&&!over?'ist dran!':''})}
  const win=s=>LINES.find(l=>l.every(i=>cells[i]===s));
  function tap(i){if(!started||over||cells[i])return;const s=turn;
    if(hard&&hist[s].length===3){cells[hist[s].shift()]=null}
    cells[i]=s;hist[s].push(i);beep(s==='g'?700:520,.06);
    const w=win(s);if(w){over=true;draw();w.forEach(j=>tcs[j].classList.add('win'));later(()=>finish('ttt',s,null,`${hard?'Hardcore':'Klassisch'} · ${esc(team(s))} hat drei in einer Reihe!`),1100);return}
    if(!hard&&cells.every(Boolean)){over=true;draw();later(()=>finish('ttt','draw',null,'Klassisch · Alle Felder sind voll.'),900);return}
    turn=s==='g'?'k':'g';draw()}
  $('#tb',el).addEventListener('pointerdown',e=>{const b=e.target.closest('.tc');if(!b)return;e.preventDefault();tap(+b.dataset.i)});
  ctr.innerHTML=`<div class="setup"><h2>⭕ Tic-Tac-Toe</h2><p>Abwechselnd ein Zeichen setzen – wer zuerst drei in einer Reihe hat, gewinnt. Die ${esc(CFG.gName)} (✕) beginnen.</p><div class="startbtns" style="margin:6px 0 0"><button class="sbtn" data-v="0" style="min-width:220px;padding:20px 26px">#️⃣<b>Klassisch</b><span>das normale Spiel</span></button><button class="sbtn" data-v="1" style="min-width:220px;padding:20px 26px">🔥<b>Hardcore</b><span>nur 3 Zeichen pro Spieler –<br>das älteste verschwindet</span></button></div></div>`;
  $$('[data-v]',ctr).forEach(b=>b.onclick=()=>{hard=b.dataset.v==='1';started=true;ctr.innerHTML='';beep(520,.05);draw()});
  draw();
}

/* ---------- Formel-Memory ---------- */
const MSYM=['π','√','∞','≈','≠','≤','∑','∠','⊥','∥','%','÷','±','°','△','²','∈','⌀'];
function vMemory(el){
  const syms=shuffle(MSYM.slice()).slice(0,10);const cards=shuffle([...syms,...syms].map((s,i)=>({s,i})));
  let turn='g',open=[],busy=false,over=false,started=false;const score={g:0,k:0},owner={};
  el.innerHTML=`<div class="game"><div class="tttw"><div class="tside g" id="ms-g"><div class="tsym" id="mc-g">0</div><div class="sh">${esc(CFG.gName)}</div><div class="tturn" id="mt-g"></div></div><div class="mgrid" id="mg">${cards.map((c,i)=>`<button class="mcard" data-i="${i}"><span>${c.s}</span></button>`).join('')}</div><div class="tside k" id="ms-k"><div class="tsym" id="mc-k">0</div><div class="sh">${esc(CFG.kName)}</div><div class="tturn" id="mt-k"></div></div></div><div class="center" id="ctr"></div>${ROT}</div>`;
  const ctr=$('#ctr',el),bs=$$('.mcard',el);
  function draw(){['g','k'].forEach(s=>{$('#mc-'+s,el).textContent=score[s];$('#ms-'+s,el).classList.toggle('act',started&&!over&&turn===s);$('#mt-'+s,el).textContent=started&&!over&&turn===s?'ist dran!':''})}
  function flip(i){if(!started||busy||over||owner[i]||open.includes(i))return;bs[i].classList.add('up');open.push(i);beep(620,.04);
    if(open.length<2)return;const[a,b]=open;
    if(cards[a].s===cards[b].s){owner[a]=owner[b]=turn;bs[a].classList.add('own-'+turn);bs[b].classList.add('own-'+turn);score[turn]++;open=[];beep(turn==='g'?760:600,.12);draw();
      if(score.g+score.k===syms.length){over=true;draw();const w=score.g>score.k?'g':score.k>score.g?'k':'draw';later(()=>finish('memory',w,null,`Paare: ${esc(CFG.gName)} ${score.g} · ${esc(CFG.kName)} ${score.k}`),900)}}
    else{busy=true;later(()=>{bs[a].classList.remove('up');bs[b].classList.remove('up');open=[];busy=false;turn=turn==='g'?'k':'g';draw()},1100)}}
  $('#mg',el).addEventListener('pointerdown',e=>{const b=e.target.closest('.mcard');if(!b)return;e.preventDefault();flip(+b.dataset.i)});
  intro(ctr,'🧠 Formel-Memory',`Findet die Paare mathematischer Zeichen! Wer ein Paar findet, darf nochmal. Wer am Ende mehr Paare hat, gewinnt. Die ${esc(CFG.gName)} beginnen.`,'Start!',()=>{ctr.innerHTML='';started=true;draw()});
  draw();
}

/* ---------- Bestenliste ---------- */
let boardMode='overview',rotPaused=false,rotIdx=0,announced=new Set(),annQ=[],annBusy=false;
function seedAnn(){for(const r of results())if(r.name||Date.now()-r.ts>600000)announced.add(r.id)}
function checkAnn(){const t=Date.now();for(const r of results()){if(announced.has(r.id))continue;
  if(t-r.ts>600000||typeof r.value!=='number'){announced.add(r.id);continue}if(!r.name)continue;announced.add(r.id);
  const rec=dayRecord(r.game),top=winList(r.game)[0];
  if(rec&&rec.id===r.id)annQ.push(['⭐ Neuer Tagesrekord!',r]);else if(top&&top.id===r.id)annQ.push(['🏆 Neue Nummer 1!',r])}
  showAnn()}
function showAnn(){if(annBusy||!annQ.length||VIEW!=='board')return;annBusy=true;const[t,r]=annQ.shift();const g=GAMES[r.game];
  const d=document.createElement('div');d.className='ann';d.innerHTML=`<div class="annb"><div class="a1">${t}</div><div class="a2">${esc(r.name)}</div><div class="a3">${g?g.icon+' '+esc(g.name)+' · '+g.fmt(r.value):''}</div></div>`;
  document.body.appendChild(d);fanfare();setTimeout(()=>{d.remove();annBusy=false;showAnn()},6500)}
const medal=i=>['🥇','🥈','🥉'][i]||(i+1)+'.';
function rowHtml(r,i,big){const rem=Math.max(0,Math.ceil((r.ts+WIN()*60000-Date.now())/60000));const g=GAMES[r.game];
  return `<div class="row${i<3?' p':''}"><span class="r">${medal(i)}</span><span class="n">${esc(r.name||'(ohne Namen)')}</span><span class="v">${g.fmt(r.value)}</span>${EDIT?`<button class="x" data-del="${esc(r.id)}">✕</button>`:`<span class="t">⏳ ${rem} Min.</span>`}</div>`}
function vBoard(el){el.innerHTML=`<div class="board" id="board"></div><div class="bctl"><button class="ib" id="bov">▦ Übersicht</button><button class="ib" id="brot"></button></div>`;
  seedAnn();boardMode='overview';drawBoard();

  br.onclick=()=>{if(!CFG.rotate){CFG.rotate=true;rotPaused=false}else rotPaused=!rotPaused;lab()};
  $('#bov',el).onclick=()=>{boardMode='overview';drawBoard()};
  const rotStep=()=>{if(!rotPaused&&!EDIT&&CFG.rotate){const seq=['overview',...Object.keys(GAMES).filter(k=>!GAMES[k].noValue&&(winList(k).length||dayRecord(k)))];
      rotIdx=(seq.indexOf(boardMode)+1)%seq.length;boardMode=seq[rotIdx];drawBoard()}
    later(rotStep,boardMode==='overview'?20000:9000)};
  later(rotStep,20000);
  const tick=()=>{drawBoard();checkAnn();later(tick,30000)};later(tick,30000);
}
function drawBoard(){const b=$('#board');if(!b)return;const t=tally();const tot=t.g+t.k;const pct=tot?Math.round(t.g/tot*100):50;

  b.innerHTML=`${head}<div class="bsub">Bestenliste der letzten ${WIN()} Minuten · ⭐ = Tagesrekord</div>
  ${EDIT?`<div style="text-align:center;margin-bottom:12px"><button class="btn" id="edone">Bearbeiten beenden</button></div>`:''}
  <div class="cards">${Object.entries(GAMES).map(([k,g])=>{if(g.noValue){const tt=tally(k);return `<div class="card"><h3>${g.icon} ${esc(g.name)}</h3><div class="rec">Duelle heute</div><div class="bigrec" style="font-size:clamp(24px,3.6vh,36px)"><span style="color:var(--g)">${esc(CFG.gName)} ${tt.g}</span> : <span style="color:var(--k)">${tt.k} ${esc(CFG.kName)}</span></div></div>`}const l=EDIT?results().filter(r=>r.game===k&&typeof r.value==='number'&&r.ts>=dayStart()).sort((a,b)=>a.value-b.value):winList(k).slice(0,5);const rec=dayRecord(k);
    return `<div class="card" data-g="${k}"><h3>${g.icon} ${esc(g.name)}</h3><div class="rec">⭐ ${rec?`${esc(rec.name||'(ohne Namen)')} · ${g.fmt(rec.value)}`:'noch kein Tagesrekord'}</div>
    ${l.length?l.map((r,i)=>rowHtml(r,i)).join(''):'<div class="empty">Noch keine Einträge</div>'}</div>`}).join('')}</div>`;
  const ed=$('#edone',b);if(ed)ed.onclick=()=>{EDIT=false;drawBoard()};
  $$('[data-del]',b).forEach(x=>x.onclick=e=>{e.stopPropagation();ask('Eintrag löschen?','Ja, löschen',()=>delResult(x.dataset.del))});
  if(!EDIT)$$('.card[data-g]',b).forEach(c=>c.onclick=()=>{boardMode=c.dataset.g;drawBoard()});
}

    <p class="det" style="margin:8px 0">${stx}</p>
    <div class="ovbtns" style="justify-content:flex-start"><button class="btn ghost" id="edit">Einzelne Einträge löschen</button><button class="btn red" id="clr">Bestenliste löschen</button><button class="btn red" id="rst">Bestenliste und Tagesrekord löschen</button></div></div>
  <div class="grp"><h3>🪢 Mathe-Tauziehen</h3>${nf('tzSteps','Punkte Vorsprung zum Sieg',2,15,1)}${nf('tzPenalty','Pause nach falscher Antwort (s)',0.3,5,0.1)}</div>
  <div class="grp"><h3>⚡ Reaktionsduell</h3>${nf('rkWins','Gewonnene Runden zum Sieg',1,5,1)}${nf('rkHandicap','Handicap Klasse (ms)',0,300,10,'wird zur Zeit der Klasse addiert')}</div>
  <div class="grp"><h3>⏱️ Blind-Stopp</h3>${nf('blTarget','Zielzeit (s)',3,60,1)}${nf('blVisG','Uhr sichtbar – Besucher (s)',0,30,0.5)}${nf('blVisK','Uhr sichtbar – Klasse (s)',0,30,0.5)}</div>
  <div class="grp"><h3>🏳️ Rate-Duell: Flaggen</h3>${nf('flG','Punkte zum Sieg – Besucher',1,15,1)}${nf('flK','Punkte zum Sieg – Klasse',1,15,1)}
    <div class="fr"><label>Flaggen</label><select data-s="flPool"><option value="leicht"${S.flPool==='leicht'?' selected':''}>Bekannte (${FLAGS.filter(f=>f.e).length})</option><option value="alle"${S.flPool==='alle'?' selected':''}>Alle (${FLAGS.length})</option></select></div></div>
  <div class="grp"><h3>🐾 Rate-Duell: Tiere</h3>${nf('tiG','Punkte zum Sieg – Besucher',1,15,1)}${nf('tiK','Punkte zum Sieg – Klasse',1,15,1,'die Klasse sieht nur den Schatten')}</div>
  <div class="grp"><h3>🧊 Rate-Duell: Körper</h3>${nf('krG','Punkte zum Sieg – Besucher',1,15,1)}${nf('krK','Punkte zum Sieg – Klasse',1,15,1)}</div>
  <div class="grp"><h3>📐 Rate-Duell: Formeln & Einheiten</h3>${nf('fzG','Punkte zum Sieg – Besucher',1,15,1)}${nf('fzK','Punkte zum Sieg – Klasse',1,15,1)}</div>
  <div class="grp"><h3>🎨 Farben-Falle</h3>${nf('faG','Punkte zum Sieg – Besucher',1,15,1)}${nf('faK','Punkte zum Sieg – Klasse',1,15,1,'Knöpfe der Klasse werden gemischt')}</div>
  <div class="grp"><h3>🔢 Zahlen-Jagd</h3>${nf('zjG','Zahlen bis – Besucher',5,40,1)}${nf('zjK','Zahlen bis – Klasse',5,40,1)}</div>
  <div class="grp"><h3>🔵 Schätz-Duell</h3>${nf('seN','Punkte zum Sieg',1,9,1)}${nf('seShow','Anzeigedauer (s)',0.3,5,0.1)}</div>
  <div class="grp"><h3>🧊 Würfel-Blick</h3>${nf('wbN','Punkte zum Sieg (beide)',1,15,1)}</div>
  <div class="ovbtns" style="padding-bottom:30px"><button class="btn big" id="sv">Speichern</button><button class="btn ghost" id="cx">Zurück</button><button class="btn ghost" id="rstart">Startauswahl anzeigen</button></div>
  </div></div>`;
  let logo=CFG.logo;
  $('#lf',el).onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const m=256,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);logo=c.toDataURL('image/png');$('#lpv',el).src=logo;toast('Logo geladen – jetzt speichern')};img.src=fr.result};fr.readAsDataURL(f)};
  $('#lrm',el).onclick=()=>{logo='';$('#lpv',el).src=DEFAULT_LOGO;toast('Standardlogo – jetzt speichern')};
  const collect=()=>{
    $$('[data-s]',el).forEach(i=>{const k=i.dataset.s;if(k==='flPool')S[k]=i.value;else{const v=parseFloat(String(i.value).replace(',','.'));if(isFinite(v))S[k]=v}});
    $$('[data-c]',el).forEach(i=>{const v=i.value.trim();if(v)CFG[i.dataset.c]=i.dataset.c==='pin'?v.replace(/\D/g,'').slice(0,8)||CFG.pin:v});LS.set('auth',todayStr());
    CFG.logo=logo;CFG.win=+$('#win',el).value;CFG.rotate=$('#rotate',el).value==='1';
    CFG.enabled=$('#enabled',el).value==='1';CFG.osk=$('#osk',el).value==='1';LS.set('fsbtn',$('#fsb',el).value==='1');
    ROLE=$('#role',el).value;LS.set('role',ROLE);LOCK=$('#lock',el).value;LS.set('lock',LOCK);
    DEVNAME=$('#devn',el).value.trim()||DEVNAME;LS.set('devname',DEVNAME);SOUND=$('#snd',el).value==='1';LS.set('sound',SOUND)};
  $('#sv',el).onclick=async()=>{collect();await saveCfg();toast('Gespeichert ✓');go(home())};
  $('#cx',el).onclick=()=>go(home());
  $('#rstart',el).onclick=()=>{ROLE='';LS.set('role','');go('start')};
  $('#edit',el).onclick=()=>{go('board');EDIT=true;drawBoard()};
  $('#clr',el).onclick=()=>ask('Sicher? Bestenliste löschen?','Ja, löschen',async()=>{CFG.clearedAt=Date.now();await saveCfg();refresh();toast('Bestenliste geleert – Tagesrekorde bleiben')},'Die Tagesrekorde bleiben erhalten.');
  $('#rst',el).onclick=()=>ask('Sicher? Bestenliste UND Tagesrekorde löschen?','Weiter',()=>askHold(SB_ON?'Alle Ergebnisse auf allen Geräten endgültig löschen?':'Alle Ergebnisse auf diesem Gerät endgültig löschen?',async()=>{await resetAll();toast('Alles gelöscht')}),'Das löscht alle Ergebnisse des Tages endgültig.');
}

/* ---------- Zugang & Bildschirmtastatur ---------- */
function gateView(){if(CFG.enabled===false)return 'off';if(LS.get('auth','')!==todayStr())return 'login';return null}
function showFS(){const v=LS.get('fsbtn',null);return v==null?ROLE==='board':!!v}
const gateHead=()=>`<img class="biglogo" src="${esc(logoSrc())}" alt=""><h1>${esc(CFG.title)}</h1><div class="st">${esc(CFG.subtitle)}</div>`;
function vOff(el){el.innerHTML=`<div class="startw">${gateHead()}<p style="font-size:24px;margin-top:24px">Diese App ist zurzeit nicht verfügbar.</p><button class="ib" id="adm" style="margin-top:16px">🔒 Lehrkraft</button></div>`;
  $('#adm',el).onclick=()=>askPin(()=>go('settings'))}
function vLogin(el){el.innerHTML=`<div class="startw">${gateHead()}<p style="font-size:20px;margin-top:18px">Bitte Passwort eingeben</p><div class="nr" style="width:min(440px,90vw)"><input id="pw" type="password" autocomplete="off" placeholder="Passwort"><button class="btn" id="pwok">OK</button></div><div class="warnl" id="pwr"></div></div>`;
  const inp=$('#pw',el);const ok=()=>{if(inp.value.trim().toLowerCase()===String(CFG.sitepw||'').trim().toLowerCase()){LS.set('auth',todayStr());go(home())}else{$('#pwr',el).textContent='Falsches Passwort';inp.value='';beep(160,.2,'square',.08)}};
  $('#pwok',el).onclick=ok;inp.addEventListener('keydown',e=>{if(e.key==='Enter')ok()})}
setInterval(()=>{const g=gateView();if(g&&VIEW!=='settings'&&!$('#pw')&&!$('#adm')){closeOv();renderTop();render()}},60000);
function oskHtml(){const rows=['qwertzuiopü','asdfghjklöä','yxcvbnm'];return `<div class="osk">${rows.map(r=>`<div class="okr">${[...r].map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div>`).join('')}<div class="okr"><button data-c="-">-</button><button data-c=" " class="wide">Leertaste</button><button data-c="⌫">⌫</button></div></div>`}
function oskBind(o,inp,submit){$$('.osk button',o).forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(inp.disabled)return;const c=b.dataset.c;let v=inp.value;
  if(c==='⌫')v=v.slice(0,-1);else if(v.length<14){let ch=c;if(!v||/[ \-]$/.test(v))ch=ch.toUpperCase();v+=ch}inp.value=v;beep(700,.02)}))}

/* ---------- Start ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||e.scale!==undefined&&e.scale!==1)e.preventDefault()},{passive:false});
let lastTouchEnd=0;document.addEventListener('touchend',e=>{const t=Date.now();if(t-lastTouchEnd<350&&!e.target.closest('input,textarea,select'))e.preventDefault();lastTouchEnd=t},{passive:false});
VIEW=location.hash==='#bestenliste'?'board':home();
renderTop();render();initDb();
</script>
</body>
</html>
